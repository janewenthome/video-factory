# Copy this file to a project's job.yaml and edit the values for that video.
profile: memory # memory | public-health

title: ""
goal: ""
audience: ""
duration_preset: standard # short | standard | full; use target_duration_seconds for a custom duration
target_duration_seconds: 180
aspect_ratios:
  - "16:9"
language: zh-TW

story:
  chronological: true

captions:
  enabled: true
  burn_in: true

text_annotations:
  enabled: true
  density: low # low | medium | high

narration:
  mode: none # none | auto_if_useful | user_provided; do not ask about narration during initial intake

music:
  enabled: true
  mode: auto_open_licensed # auto_open_licensed | project_music | local_licensed | none
  mood: [] # derive search terms from the project topic/story when empty
  intensity: low_to_medium # low | low_to_medium | medium | high

natural_audio:
  preserve: true

# Keep source documents in the project assets/references directory. For a
# public-health job, every medical claim used in narration or on-screen text
# must map to at least one listed source and a claim-level reference ID in the
# edit plan. Replace any example placeholders before production.
references: []

privacy_review:
  enabled: true
  check_identifiable_people: true
  review_before_publication: true

# The current production workflow processes media locally.
cloud_processing:
  colab: disabled # ask_each_run | disabled
  openai: disabled # ask_each_run | disabled

# Perception is evidence generation, not editorial selection. Current jobs use
# local-only processing; original media remains on the Mac.
privacy_mode: LOCAL_ONLY # LOCAL_ONLY | BALANCED | MAX_QUALITY
cloud_perception: false
gpu_policy: T4
temporal_backend: none # none | smolvlm2
music_license_policy: SAFE_AUTO

output:
  master: true
  subtitles_srt: true
  transcript: true
  edit_plan: true
  qa_report: true
